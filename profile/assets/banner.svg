<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">TilcAI Wallet</title>
  <desc id="d">Compras verificables para agentes de IA en Stellar. Tarjeta de ejemplo del agente Codex con 24,50 de 25 USDC disponibles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05061A"/>
      <stop offset="0.6" stop-color="#0C0B25"/>
      <stop offset="1" stop-color="#1F1A57"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6024E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6024E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#51C5FB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#51C5FB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#291698"/>
      <stop offset="0.55" stop-color="#6024E8"/>
      <stop offset="1" stop-color="#416CD5"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#51C5FB"/>
      <stop offset="1" stop-color="#925FF6"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E1DDEB"/>
      <stop offset="1" stop-color="#57D2F9"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <circle cx="1010" cy="140" r="260" fill="url(#glowV)"/>
  <circle cx="1180" cy="380" r="200" fill="url(#glowC)"/>
  <circle cx="90" cy="420" r="180" fill="url(#glowV)" opacity="0.5"/>

  <!-- Stellar-like dots -->
  <g fill="#E1DDEB">
    <circle cx="640" cy="60" r="1.6" opacity="0.6"/>
    <circle cx="720" cy="120" r="1.2" opacity="0.4"/>
    <circle cx="590" cy="370" r="1.4" opacity="0.5"/>
    <circle cx="1220" cy="70" r="1.6" opacity="0.6"/>
    <circle cx="420" cy="50" r="1.1" opacity="0.4"/>
    <circle cx="760" cy="400" r="1.3" opacity="0.5"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Left: identity -->
    <text x="72" y="92" fill="#51C5FB" font-size="18" font-weight="600" letter-spacing="3">STELLAR · AGENTIC PAYMENTS</text>
    <text x="72" y="166" fill="url(#title)" font-size="68" font-weight="800">TilcAI Wallet</text>
    <text x="72" y="214" fill="#E1DDEB" font-size="26" font-weight="500">Compras verificables para agentes de IA</text>
    <text x="72" y="254" fill="#9E9EA4" font-size="22" font-style="italic">Tu wallet. Tus agentes. Tú pones los límites.</text>

    <!-- Receipt chain -->
    <g font-size="16" font-weight="600">
      <rect x="72" y="306" width="104" height="38" rx="19" fill="#1F1A57" stroke="#925FF6"/>
      <text x="124" y="330" fill="#E1DDEB" text-anchor="middle">Permiso</text>
      <text x="192" y="331" fill="#51C5FB" text-anchor="middle">→</text>
      <rect x="208" y="306" width="92" height="38" rx="19" fill="#1F1A57" stroke="#925FF6"/>
      <text x="254" y="330" fill="#E1DDEB" text-anchor="middle">Orden</text>
      <text x="316" y="331" fill="#51C5FB" text-anchor="middle">→</text>
      <rect x="332" y="306" width="84" height="38" rx="19" fill="#1F1A57" stroke="#925FF6"/>
      <text x="374" y="330" fill="#E1DDEB" text-anchor="middle">Pago</text>
      <text x="432" y="331" fill="#51C5FB" text-anchor="middle">→</text>
      <rect x="448" y="306" width="100" height="38" rx="19" fill="#1F1A57" stroke="#51C5FB"/>
      <text x="498" y="330" fill="#E1DDEB" text-anchor="middle">Entrega</text>
    </g>
    <text x="72" y="380" fill="#9E9EA4" font-size="15">Cada compra deja un recibo que une las cuatro piezas.</text>

    <!-- Right: agent card -->
    <g transform="translate(800 74) rotate(-4)">
      <rect x="6" y="10" width="400" height="248" rx="22" fill="#05061A" opacity="0.5"/>
      <rect width="400" height="248" rx="22" fill="url(#card)"/>
      <rect width="400" height="248" rx="22" fill="none" stroke="#925FF6" stroke-opacity="0.7"/>
      <text x="28" y="44" fill="#E1DDEB" font-size="16" font-weight="700" letter-spacing="1">TilcAI</text>
      <text x="372" y="44" fill="#E1DDEB" font-size="13" text-anchor="end" opacity="0.85">AG-7K2Q</text>
      <text x="28" y="86" fill="#FFFFFF" font-size="22" font-weight="700">Codex · Portátil</text>
      <circle cx="34" cy="108" r="5" fill="#57D2F9"/>
      <text x="46" y="113" fill="#E1DDEB" font-size="14">Activa · testnet</text>
      <text x="28" y="164" fill="#FFFFFF" font-size="36" font-weight="800">24,50</text>
      <text x="138" y="164" fill="#E1DDEB" font-size="18" font-weight="600">USDC</text>
      <text x="372" y="164" fill="#E1DDEB" font-size="14" text-anchor="end" opacity="0.85">de 25,00</text>
      <rect x="28" y="180" width="344" height="10" rx="5" fill="#05061A" opacity="0.45"/>
      <rect x="28" y="180" width="337" height="10" rx="5" fill="url(#bar)"/>
      <text x="28" y="224" fill="#E1DDEB" font-size="13" opacity="0.9">Máx. 0,50 por compra</text>
      <text x="372" y="224" fill="#E1DDEB" font-size="13" text-anchor="end" opacity="0.9">1 proveedor</text>
    </g>
  </g>
</svg>
